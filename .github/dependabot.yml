# Every 3 months, Dependabot checks for newer versions of what the app is built with and opens ONE pull request per
# kind (Python packages, the Docker base image, the GitHub build steps), with all updates of that kind together.
# The tests run on each request automatically; merge it if they pass.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule: {interval: quarterly}
    groups:
      python-packages: {patterns: ["*"]}
  - package-ecosystem: docker
    directory: "/"
    schedule: {interval: quarterly}
    groups:
      base-image: {patterns: ["*"]}
  - package-ecosystem: github-actions
    directory: "/"
    schedule: {interval: quarterly}
    groups:
      build-steps: {patterns: ["*"]}
