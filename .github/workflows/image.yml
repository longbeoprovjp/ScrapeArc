# Builds the Docker image and publishes it to GitHub's container registry:
#   ghcr.io/<owner>/scrapearc:latest (newest release) and :1.0.0, :1.0 ... (each release tag v1.0.0)
#   ghcr.io/<owner>/scrapearc:main  (latest commit on main, for testing)
name: image
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3      # lets one runner build for ARM boards (Raspberry Pi) too
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/scrapearc
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
          flavor: latest=auto
          labels: |
            org.opencontainers.image.title=ScrapeArc
            org.opencontainers.image.description=Self-hosted photo and video archive with a built-in scraper
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
